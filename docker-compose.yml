services:
  admission:
    container_name: ${ADMISSION_CONTAINER_NAME}
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Admission/Dockerfile
    ports:
      - "${ADMISSION_HOST_PORT}:${ADMISSION_CONTAINER_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:${ADMISSION_CONTAINER_PORT}
      ConnectionStrings__Admission: ${ADMISSION_CONNECTION_STRING}
      MessagingParams__Host: ${RABBITMQ_HOST}
      MessagingParams__Port: ${RABBITMQ_PORT}
      MessagingParams__User: ${RABBITMQ_DEFAULT_USER}
      MessagingParams__Password: ${RABBITMQ_DEFAULT_PASS}
      AuthConfiguration__MetadataAddress: http://${AUTH_CONTAINER_NAME}:${AUTH_CONTAINER_PORT}/.well-known/openid-configuration
      AuthConfiguration__Issuer: ${AUTH_ISSUER}
      AuthConfiguration__Audience: ${AUTH_AUDIENCE}
      AuthConfiguration__RoleClaimType: role
      DictionaryApi__BaseUrl: http://${DICTIONARY_CONTAINER_NAME}:${DICTIONARY_CONTAINER_PORT}
      S3__ServiceUrl: http://${MINIO_CONTAINER_NAME}:${MINIO_API_CONTAINER_PORT}
      S3__AccessKey: ${MINIO_ROOT_USER}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD}
      S3__BucketName: ${MINIO_BUCKET_NAME}
      S3__ForcePathStyle: true
      S3__UseHttp: true
      S3__PublicServiceUrl: ${MINIO_PUBLIC_URL}
      AdmissionPrograms__MaxSelectedPrograms: ${ADMISSION_MAX_PROGRAMS}
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:${ADMISSION_CONTAINER_PORT}/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      rabbit-mq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3-storage:
        condition: service_started
      auth:
        condition: service_healthy

  dictionary:
    container_name: ${DICTIONARY_CONTAINER_NAME}
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Dictionary/Dockerfile
    ports:
      - "${DICTIONARY_HOST_PORT}:${DICTIONARY_CONTAINER_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:${DICTIONARY_CONTAINER_PORT}
      ConnectionStrings__Dictionary: ${DICTIONARY_CONNECTION_STRING}
      MessagingParams__Host: ${RABBITMQ_HOST}
      MessagingParams__Port: ${RABBITMQ_PORT}
      MessagingParams__User: ${RABBITMQ_DEFAULT_USER}
      MessagingParams__Password: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:${DICTIONARY_CONTAINER_PORT}/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      rabbit-mq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  
  auth:
    container_name: ${AUTH_CONTAINER_NAME}
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Auth/Dockerfile
    ports:
      - "${AUTH_HOST_PORT}:${AUTH_CONTAINER_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:${AUTH_CONTAINER_PORT}
      ConnectionStrings__Auth: ${AUTH_CONNECTION_STRING}
      Auth__Issuer: ${AUTH_ISSUER}
      Auth__Audience: ${AUTH_AUDIENCE}
      Security__TokenPepper: ${AUTH_TOKEN_PEPPER}
      MessagingParams__Host: ${RABBITMQ_HOST}
      MessagingParams__Port: ${RABBITMQ_PORT}
      MessagingParams__User: ${RABBITMQ_DEFAULT_USER}
      MessagingParams__Password: ${RABBITMQ_DEFAULT_PASS}
      AdminSeed__Enabled: ${AUTH_ADMIN_SEED_ENABLED}
      AdminSeed__Email: ${AUTH_ADMIN_SEED_EMAIL}
      AdminSeed__Password: ${AUTH_ADMIN_SEED_PASSWORD}
      AuthDebug__ExposeActionTokens: ${AUTH_DEBUG_EXPOSE_ACTION_TOKENS}
    volumes:
      - auth_dataprotection_keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${AUTH_CONTAINER_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      rabbit-mq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mail-manager:
    container_name: ${MAIL_MANAGER_CONTAINER_NAME}
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Mail/Dockerfile
    ports:
      - "${MAIL_MANAGER_HOST_PORT}:${MAIL_MANAGER_CONTAINER_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:${MAIL_MANAGER_CONTAINER_PORT}
      MessagingParams__Host: ${RABBITMQ_HOST}
      MessagingParams__Port: ${RABBITMQ_PORT}
      MessagingParams__User: ${RABBITMQ_DEFAULT_USER}
      MessagingParams__Password: ${RABBITMQ_DEFAULT_PASS}
      SmtpOptions__Host: ${MAILDEV_HOST}
      SmtpOptions__Port: ${MAILDEV_SMTP_PORT}
      SmtpOptions__HostName: ${SMTP_HOST_NAME}
      SmtpOptions__HostEmail: ${SMTP_HOST_EMAIL}
      ConnectionStrings__MailInbox: ${MAIL_INBOX_CONNECTION_STRING}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${MAIL_MANAGER_CONTAINER_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      rabbit-mq:
        condition: service_healthy
      mail-dev:
        condition: service_healthy
      postgres:
        condition: service_healthy

  s3-storage:
    image: quay.io/minio/minio:latest
    container_name: ${MINIO_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT}:${MINIO_API_CONTAINER_PORT}"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: "http://admission:8080/api/files/s3-event"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
  
  rabbit-mq:
    image: rabbitmq:3-management
    container_name: ${RABBITMQ_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mail-dev:
    image: maildev/maildev:latest
    container_name: ${MAILDEV_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${MAILDEV_SMTP_PORT}:1025"
      - "${MAILDEV_WEB_PORT}:1080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data_pg18:/var/lib/postgresql
      - ./postgres-configs:/docker-entrypoint-initdb.d

volumes:
  auth_dataprotection_keys:
  minio_data:
  rabbitmq_data:
  postgres_data_pg18:
